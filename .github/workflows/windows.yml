name: Windows

# Builds a Windows x64 release and uploads it as a downloadable artifact.
# media_kit bundles libmpv.dll on Windows, so the build is self-contained.
# Run manually via "Run workflow", or it fires automatically on a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Build Windows release
        run: flutter build windows --release

      # Bundle the MSVC runtime (MSVCP140.dll, VCRUNTIME140*.dll) next to the exe
      # so the app runs on a clean Windows install without the VC++ redistributable.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "Could not locate a Visual Studio installation via vswhere" }
          Write-Host "Visual Studio: $vsPath"
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Select-Object -First 1
          if (-not $crt) { throw "Could not locate the MSVC x64 CRT redistributable under $vsPath" }
          Write-Host "Bundling CRT from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" -Destination "build\windows\x64\runner\Release\" -Force
          Get-ChildItem "build\windows\x64\runner\Release\" -Filter "*140*.dll" | Format-Table Name

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Fathom-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
