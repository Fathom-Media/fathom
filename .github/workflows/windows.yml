name: Windows

# Builds a Windows x64 release and uploads it as a downloadable artifact.
# media_kit bundles libmpv.dll on Windows, so the build is self-contained.
# Run manually via "Run workflow", or it fires automatically on a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override build version (testing update install), e.g. 0.8.0'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write # attach the zip to the release on a tag
    env:
      # smtc_windows builds a Rust DLL via cargokit at compile time. cargokit's
      # symlink resolver fails when the pub cache lives under %AppData%
      # ("Get-Item : Could not find item C:\Users\...\AppData"), which silently
      # skips building smtc_windows.dll while still reporting build success — the
      # media controls then never initialize at runtime. Putting the pub cache on
      # a short, non-AppData path makes symlink resolution succeed.
      PUB_CACHE: C:\tmp\pubcache
    steps:
      - uses: actions/checkout@v4

      # Caching is OFF on purpose: the pub cache also holds cargokit's compiled
      # smtc_windows.dll, and a restored cache makes cargokit skip rebuilding it,
      # so the frb-version pin below would never actually get compiled. A fresh
      # pub cache each run guarantees the Rust crate is rebuilt with the pin.
      # PUB_CACHE (job env) still points off %AppData% so the cargokit symlink
      # resolve succeeds.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: false

      # cargokit compiles smtc_windows' Rust crate into a DLL during the build,
      # so the toolchain must be present.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      # ffmpeg_kit_flutter_new_audio is only ever used on Android (Dart code
      # gates every call behind Platform.isAndroid); its Windows CMakeLists.txt
      # still unconditionally downloads a real ffmpeg DLL set and patches them
      # (ASLR/rebase) regardless. The plugin LoadLibrary()s that DLL lazily at
      # runtime rather than linking it, so the glue library builds fine without
      # it — strip the download/patch section so Windows doesn't pay for a
      # dependency it never calls.
      - name: Neuter ffmpeg_kit_flutter's native bundle (Windows doesn't use it)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem "$env:PUB_CACHE\hosted\pub.dev" -Directory -Filter "ffmpeg_kit_flutter_new_audio-*" | Select-Object -First 1
          if (-not $pkg) { throw "ffmpeg_kit_flutter_new_audio not found under $env:PUB_CACHE" }
          $path = Join-Path $pkg.FullName "windows\CMakeLists.txt"
          $content = Get-Content $path -Raw
          $marker = 'if(CMAKE_SYSTEM_PROCESSOR STREQUAL "AMD64" OR CMAKE_SYSTEM_PROCESSOR STREQUAL "x86_64")'
          $idx = $content.IndexOf($marker)
          if ($idx -lt 0) { throw "Expected architecture-detection block not found in $path" }
          $content = $content.Substring(0, $idx) + "set(ffmpeg_kit_flutter_new_audio_bundled_libraries `"`" PARENT_SCOPE)`n"
          Set-Content $path $content -NoNewline

      # smtc_windows 1.1.0's Dart bindings are generated with flutter_rust_bridge
      # 2.11.1 and its Cargo.toml exact-pins the main frb crate, but NOT the
      # companion flutter_rust_bridge_macros crate — so cargo lets it drift to a
      # newer minor (2.12.0). At runtime that surfaces as the reported bridge
      # version, and RustLib.init() throws "codegen version (2.11.1) should be the
      # same as runtime version (2.12.0)", so the media controls silently never
      # register. Exact-pin the companion crate in the package manifest so the
      # compiled runtime matches the codegen.
      - name: Pin smtc_windows' Rust bridge to its codegen version
        shell: pwsh
        run: |
          $pkg = Get-ChildItem "$env:PUB_CACHE\hosted\pub.dev" -Directory -Filter "smtc_windows-*" | Select-Object -First 1
          if (-not $pkg) { throw "smtc_windows not found under $env:PUB_CACHE" }
          $toml = Join-Path $pkg.FullName "rust\Cargo.toml"
          $c = Get-Content $toml -Raw
          if ($c -notmatch 'flutter_rust_bridge_macros') {
            $c = $c -replace 'flutter_rust_bridge = "=2\.11\.1"', "flutter_rust_bridge = `"=2.11.1`"`nflutter_rust_bridge_macros = `"=2.11.1`""
            Set-Content $toml $c
            Write-Host "Pinned flutter_rust_bridge_macros=2.11.1 in $toml"
          }
          Remove-Item (Join-Path $pkg.FullName "rust\Cargo.lock") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg.FullName "rust\target") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Build Windows release
        shell: pwsh
        run: |
          # Version precedence: a manual "version" input (for testing self-update)
          # wins; otherwise a v* tag uses its exact tag (e.g. 0.9.0-beta.2) so the
          # build reports the right version for update checks. Edit pubspec rather
          # than pass --build-name, so Linux and Windows stamp identically.
          $v = ''
          if ('${{ inputs.version }}' -ne '') {
            $v = '${{ inputs.version }}'
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($v -ne '') {
            Write-Host "Stamping pubspec version: $v+$env:GITHUB_RUN_NUMBER"
            (Get-Content pubspec.yaml) -replace '^version: .*', "version: $v+$env:GITHUB_RUN_NUMBER" | Set-Content pubspec.yaml
            # For the installer step further down (Inno Setup's AppVersion).
            Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"
          }
          flutter build windows --release

      # Bundle the MSVC runtime (MSVCP140.dll, VCRUNTIME140*.dll) next to the exe
      # so the app runs on a clean Windows install without the VC++ redistributable.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "Could not locate a Visual Studio installation via vswhere" }
          Write-Host "Visual Studio: $vsPath"
          # Pick the newest DESKTOP x64 CRT (exclude the onecore/debug variants), keyed
          # off msvcp140.dll's file version so we never bundle a CRT older than the
          # toolset that compiled the exe.
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter "msvcp140.dll" |
            Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore' -and $_.FullName -notmatch 'debug' -and $_.FullName -notmatch 'spectre' } |
            Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending |
            Select-Object -First 1
          if (-not $crt) { throw "Could not locate the MSVC x64 CRT redistributable under $vsPath" }
          $crtDir = $crt.DirectoryName
          Write-Host "Bundling CRT $($crt.VersionInfo.FileVersion) from $crtDir"
          Copy-Item "$crtDir\*.dll" -Destination "build\windows\x64\runner\Release\" -Force
          Get-ChildItem "build\windows\x64\runner\Release\" -Filter "*140*.dll" | Format-Table Name

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Fathom-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7

      # Package the release zip with a top-level "Fathom" folder, the shape the
      # in-app updater and manual users expect.
      - name: Package release zip
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\Fathom | Out-Null
          Copy-Item build\windows\x64\runner\Release\* staging\Fathom\ -Recurse -Force
          Compress-Archive -Path staging\Fathom -DestinationPath Fathom-windows-x64.zip -Force

      # A real installer alongside the zip, for testers who want a Start Menu
      # entry and uninstaller instead of a folder they manage themselves. Not
      # the in-app update payload (app_updates.dart only ever picks the
      # *.zip asset), just an alternate first-install option; installs
      # per-user so it stays fully compatible with that same updater, which
      # overwrites its own install folder with no elevation (see fathom.iss).
      - name: Install Inno Setup
        if: github.ref_type == 'tag'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          if ([string]::IsNullOrEmpty($v)) { $v = '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" windows\installer\fathom.iss
          Copy-Item windows\installer\Output\Fathom-Setup-x64.exe Fathom-Setup-x64.exe

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fathom-windows-x64.zip
            Fathom-Setup-x64.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # For dev tags (v...-devNN, or the legacy v...-dev.N), also point the
      # floating "dev-latest" pre-release at this build so testers have one stable
      # "always latest dev" download URL.
      - name: Update dev-latest alias
        if: github.ref_type == 'tag' && contains(github.ref_name, '-dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Dev Build (latest)
          files: |
            Fathom-windows-x64.zip
            Fathom-Setup-x64.exe
          prerelease: true
          make_latest: false
