name: AppImage

# Builds portable, self-contained Linux AppImages (libmpv+codecs bundled via
# BUNDLE_MPV=1, so no host mpv is required) for BOTH x86_64 and aarch64. Built on
# Ubuntu 24.04: older bases (22.04) ship libmpv too old for media_kit's video
# renderer (video comes up as a solid colour), so 24.04's libmpv 0.38 is the
# floor. Its glibc still runs on current distros. aarch64 builds natively on a
# GitHub-hosted arm64 runner (Flutter can't cross-compile Linux desktop). Run
# manually via "Run workflow", or on a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override build version (e.g. 0.9.0-beta.2)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: write # attach the AppImage to the release on a tag
    steps:
      - uses: actions/checkout@v4

      # Cache the downloaded pub packages so `flutter pub get` is near-instant
      # when pubspec.lock is unchanged. Safe: a miss just re-downloads. (The
      # x86_64 Flutter SDK itself is already cached by subosito below; the
      # aarch64 SDK install is left uncached deliberately to keep the release
      # pipeline simple.)
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-pub-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libjson-glib-dev \
            libmpv-dev mpv patchelf wget file desktop-file-utils xvfb

      - name: Set up Flutter (x86_64)
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      # subosito/flutter-action has no arm64 Linux SDK in its manifest ("Unable
      # to determine Flutter version ... architecture: arm64"), so install from
      # git on the arm64 runner — the flutter tool bootstraps the arm64 Dart SDK
      # and linux engine artifacts itself.
      - name: Set up Flutter (aarch64, from git)
        if: matrix.arch == 'aarch64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --enable-linux-desktop
          "$HOME/flutter/bin/flutter" precache --linux
          "$HOME/flutter/bin/flutter" --version

      # ffmpeg_kit_flutter_new_audio is only ever used on Android (Dart code
      # gates every call behind Platform.isAndroid); its Linux CMakeLists.txt
      # still unconditionally downloads and bundles a real, x86_64-only
      # prebuilt ffmpeg (upstream has no aarch64 Linux build at all), which
      # broke aarch64 outright and adds dead weight to x86_64. The plugin
      # dlopen()s that binary lazily at runtime rather than linking it, so the
      # glue library only actually needs GTK + json-glib to build — strip the
      # download/link section post-fetch, before it's ever consulted.
      - name: Neuter ffmpeg_kit_flutter's native bundle (Linux doesn't use it)
        run: |
          flutter pub get
          cmake_file=$(find "$HOME/.pub-cache" -path \
            '*ffmpeg_kit_flutter_new_audio*/linux/CMakeLists.txt' | head -1)
          if [[ -z "$cmake_file" ]]; then
            echo "::error::ffmpeg_kit_flutter_new_audio CMakeLists.txt not found in pub-cache"
            exit 1
          fi
          # Keep everything through the target_link_libraries call (still needs
          # GTK + json-glib to compile); replace the "--- native bundle ---"
          # section after it with a no-op.
          sed -i '/^# --- native bundle/,$d' "$cmake_file"
          echo 'set(ffmpeg_kit_flutter_new_audio_bundled_libraries "" PARENT_SCOPE)' \
            >> "$cmake_file"

      - name: Build self-contained AppImage
        env:
          BUNDLE_MPV: '1'
          ARCH: ${{ matrix.arch }}
        run: |
          # Set the pubspec version so the build reports the right version for
          # update checks: a manual "version" input wins, else a v* tag uses its
          # tag. `flutter build linux` ignores --build-name, so edit pubspec.
          V=""
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$V" ]]; then
            echo "Stamping pubspec version: ${V}+${GITHUB_RUN_NUMBER}"
            sed -i "s/^version: .*/version: ${V}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          fi
          ./tool/build_appimage.sh

      - name: Smoke test (loads past the dynamic linker headlessly)
        run: |
          set -x
          code=0
          timeout 60 xvfb-run -a ./build/Fathom-${{ matrix.arch }}.AppImage --appimage-extract-and-run &>/tmp/smoke.log || code=$?
          echo "exit=$code"
          tail -20 /tmp/smoke.log || true
          # A clean start that we then time out is fine; a loader/link crash is not.
          if [ "$code" = "139" ] || [ "$code" = "134" ]; then echo "::error::AppImage crashed on start"; exit 1; fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Fathom-${{ matrix.arch }}-AppImage
          path: |
            build/Fathom-${{ matrix.arch }}.AppImage
            build/Fathom-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fathom-${{ matrix.arch }}.AppImage
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # For dev tags (v...-devNN, or the legacy v...-dev.N), also point the
      # floating "dev-latest" pre-release at this build so testers have one stable
      # "always latest dev" download URL. Each arch attaches its own file
      # (distinct names), so both live on dev-latest.
      - name: Update dev-latest alias
        if: github.ref_type == 'tag' && contains(github.ref_name, '-dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Dev Build (latest)
          files: build/Fathom-${{ matrix.arch }}.AppImage
          prerelease: true
          make_latest: false
