name: AppImage

# Builds a portable, self-contained Linux AppImage and bundles libmpv+codecs
# (BUNDLE_MPV=1) so no host mpv is required. Built on Ubuntu 24.04: older bases
# (22.04) ship libmpv too old for media_kit's video renderer (video comes up as
# a solid colour), so 24.04's libmpv 0.38 is the floor. Its glibc still runs on
# current distros. Run manually via "Run workflow", or on a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override build version (e.g. 0.9.0-beta.2)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  appimage:
    name: Build portable AppImage (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the AppImage to the release on a tag
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libmpv-dev mpv patchelf wget file desktop-file-utils xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build self-contained AppImage
        env:
          BUNDLE_MPV: '1'
        run: |
          # Set the pubspec version so the build reports the right version for
          # update checks: a manual "version" input wins, else a v* tag uses its
          # tag. `flutter build linux` ignores --build-name, so edit pubspec.
          V=""
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$V" ]]; then
            echo "Stamping pubspec version: ${V}+${GITHUB_RUN_NUMBER}"
            sed -i "s/^version: .*/version: ${V}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          fi
          ./tool/build_appimage.sh

      - name: Smoke test (loads past the dynamic linker headlessly)
        run: |
          set -x
          code=0
          timeout 60 xvfb-run -a ./build/Fathom-x86_64.AppImage --appimage-extract-and-run &>/tmp/smoke.log || code=$?
          echo "exit=$code"
          tail -20 /tmp/smoke.log || true
          # A clean start that we then time out is fine; a loader/link crash is not.
          if [ "$code" = "139" ] || [ "$code" = "134" ]; then echo "::error::AppImage crashed on start"; exit 1; fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Fathom-x86_64-AppImage
          path: |
            build/Fathom-x86_64.AppImage
            build/Fathom-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fathom-x86_64.AppImage
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # For -dev.N tags, also point the floating "dev-latest" pre-release at this
      # build so testers have one stable "always latest dev" download URL.
      - name: Update dev-latest alias
        if: github.ref_type == 'tag' && contains(github.ref_name, '-dev.')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Dev Build (latest)
          files: build/Fathom-x86_64.AppImage
          prerelease: true
          make_latest: false
