name: AppImage

# Builds a portable, self-contained Linux AppImage and bundles libmpv+codecs
# (BUNDLE_MPV=1) so no host mpv is required. Built on Ubuntu 24.04: older bases
# (22.04) ship libmpv too old for media_kit's video renderer (video comes up as
# a solid colour), so 24.04's libmpv 0.38 is the floor. Its glibc still runs on
# current distros. Run manually via "Run workflow", or on a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  appimage:
    name: Build portable AppImage (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libmpv-dev mpv patchelf wget file desktop-file-utils xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build self-contained AppImage
        env:
          BUNDLE_MPV: '1'
        run: |
          # On a v* tag, stamp the app version from the tag so the released
          # build reports its exact tag (e.g. 0.9.0-beta.2) for update checks.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            export BUILD_NAME="${GITHUB_REF_NAME#v}"
            echo "Stamping version: $BUILD_NAME"
          fi
          ./tool/build_appimage.sh

      - name: Smoke test (loads past the dynamic linker headlessly)
        run: |
          set -x
          code=0
          timeout 60 xvfb-run -a ./build/Fathom-x86_64.AppImage --appimage-extract-and-run &>/tmp/smoke.log || code=$?
          echo "exit=$code"
          tail -20 /tmp/smoke.log || true
          # A clean start that we then time out is fine; a loader/link crash is not.
          if [ "$code" = "139" ] || [ "$code" = "134" ]; then echo "::error::AppImage crashed on start"; exit 1; fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Fathom-x86_64-AppImage
          path: |
            build/Fathom-x86_64.AppImage
            build/Fathom-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7
