name: Docs

# Builds the MkDocs Material site from docs/ and publishes it with `mkdocs
# gh-deploy`, which pushes the built HTML to the `gh-pages` branch. Pages then
# serves that branch (Settings -> Pages -> Source: Deploy from a branch ->
# gh-pages). This is the classic MkDocs deploy: no github-pages environment and
# no per-branch allow-list, so it publishes straight from dev while the app is
# in active development. Narrow the branches below once things stabilise.
on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - name: Configure git identity
        run: |
          git config user.name "thebigjoe1"
          git config user.email "26659217+thebigjoe1@users.noreply.github.com"
      - name: Build and publish to gh-pages
        run: mkdocs gh-deploy --force --strict
