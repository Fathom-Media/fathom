name: Docs

# Builds the MkDocs Material site from docs/ and publishes it to GitHub Pages.
# Deploys from dev and main while the app is in active development so the docs
# match the Beta builds testers run; narrow to main only once things stabilise.
# Pages must be enabled (Settings -> Pages -> Source: GitHub Actions) and the
# github-pages environment must allow whichever branch deploys here.
on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer one supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
